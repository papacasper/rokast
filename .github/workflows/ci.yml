# Every push and pull request: shell checks, the Rust workspace (fmt, clippy, tests, the frozen answers in
# tests/parity), desktop app build, and the .deb / .rpm / Arch package built and installed in clean ubuntu:22.04 /
# fedora:43 / archlinux containers (each test checks the package pulls in no interpreter).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the self-update test installs v0.4.0 (or main) from git
      - name: bash -n + shellcheck
        run: |
          for f in scripts/* packaging/stage packaging/supplicant packaging/deb/build-deb packaging/rpm/build-rpm packaging/aur/update; do bash -n "$f"; done
          shellcheck scripts/* tests/*.sh tests/parity/*.sh packaging/stage packaging/supplicant packaging/deb/build-deb packaging/rpm/build-rpm packaging/aur/update
      - name: rokast (the install and self-update tests install it)
        run: cargo build --release --locked -p rokast
      - name: install script test
        run: bash tests/test_install.sh
      - name: self-update test (rokast update against a local fake GitHub)
        run: bash tests/test_self_update.sh
      # The real release key (repo secret) must match config/release-signers, or the next release fails to sign.
      # Secrets are not given to pull requests from forks; skip there.
      - name: release key matches config/release-signers
        env:
          ROKAST_SIGNING_KEY: ${{ secrets.ROKAST_SIGNING_KEY }}
        run: |
          if [ -z "$ROKAST_SIGNING_KEY" ]; then echo "no secret (fork PR): skipped"; exit 0; fi
          echo "dry run $GITHUB_SHA" > dry-run.txt && scripts/sign-release dry-run.txt

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: GTK 4 dev files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev xvfb xauth dbus
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ui
      - name: rokast-core + rokast (fmt, clippy, tests)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: same answers as before the port (tests/parity/expected.jsonl)
        run: tests/parity/run.sh
      - name: same output as before the port, command by command (tests/parity/cli, no TV needed)
        run: tests/parity/cli.sh
      - name: app build + test
        working-directory: ui
        run: |
          cargo build --locked
          cargo test --locked
      - name: the app starts and stays up (headless X)
        run: tests/test_ui_starts.sh

  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: build deps (GTK 4, supplicant, rpmbuild)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libnl-3-dev libnl-genl-3-dev libssl-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ui
      - run: cargo build --release --locked --manifest-path ui/Cargo.toml
      - run: cargo build --release --locked -p rokast
      - run: packaging/deb/build-deb dist
      - run: bash tests/test_pkg_deb.sh dist/*.deb
      - run: packaging/rpm/build-rpm dist
      - run: bash tests/test_pkg_rpm.sh dist/*.rpm
      - name: rokast update on .deb and .rpm installs (A -> signed B, in clean containers)
        run: |
          bash tests/test_pkg_update.sh deb
          bash tests/test_pkg_update.sh rpm

  arch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # rokast-git's pkgver() runs git describe --tags
      - name: rokast-git built (makepkg + check() + namcap) and installed in a clean archlinux container
        run: bash tests/test_pkg_arch.sh rokast-git
