# Every push and pull request: Python tests on the oldest and newest supported Python, shell checks, desktop app build,
# and the .deb / .rpm built and installed in clean ubuntu:22.04 / fedora:43 containers.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -I -m unittest discover -s tests -v

  scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n + shellcheck
        run: |
          for f in scripts/* packaging/stage packaging/supplicant packaging/deb/build-deb packaging/rpm/build-rpm packaging/aur/update; do bash -n "$f"; done
          shellcheck scripts/* tests/*.sh packaging/stage packaging/supplicant packaging/deb/build-deb packaging/rpm/build-rpm packaging/aur/update
      - name: install script test
        run: if [ -f tests/test_install.sh ]; then bash tests/test_install.sh; fi
      # The real release key (repo secret) must match config/release-signers, or the next release fails to sign.
      # Secrets are not given to pull requests from forks; skip there.
      - name: release key matches config/release-signers
        env:
          ROKAST_SIGNING_KEY: ${{ secrets.ROKAST_SIGNING_KEY }}
        run: |
          if [ -z "$ROKAST_SIGNING_KEY" ]; then echo "no secret (fork PR): skipped"; exit 0; fi
          echo "dry run $GITHUB_SHA" > dry-run.txt && scripts/sign-release dry-run.txt

  ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: GTK 4 dev files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
      - name: build + test
        working-directory: ui
        run: |
          cargo build --locked
          cargo test --locked

  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: build deps (GTK 4, supplicant, rpmbuild)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libnl-3-dev libnl-genl-3-dev libssl-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
      - run: cargo build --release --locked --manifest-path ui/Cargo.toml
      - run: packaging/deb/build-deb dist
      - run: bash tests/test_pkg_deb.sh dist/*.deb
      - run: packaging/rpm/build-rpm dist
      - run: bash tests/test_pkg_rpm.sh dist/*.rpm
