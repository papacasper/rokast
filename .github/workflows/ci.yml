# Every push and pull request: Python tests on the oldest and newest supported Python, shell checks, desktop app build,
# and the .deb built and installed in a clean ubuntu:22.04 container.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -I -m unittest discover -s tests -v

  scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n + shellcheck
        run: |
          for f in scripts/* packaging/stage packaging/deb/build-deb packaging/aur/update; do bash -n "$f"; done
          shellcheck scripts/* tests/*.sh packaging/stage packaging/deb/build-deb packaging/aur/update
      - name: install script test
        run: if [ -f tests/test_install.sh ]; then bash tests/test_install.sh; fi

  ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: GTK 4 dev files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
      - name: build + test
        working-directory: ui
        run: |
          cargo build --locked
          cargo test --locked

  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: build deps (GTK 4, supplicant)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libnl-3-dev libnl-genl-3-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
      - run: cargo build --release --locked --manifest-path ui/Cargo.toml
      - run: packaging/deb/build-deb dist
      - run: bash tests/test_pkg_deb.sh dist/*.deb
