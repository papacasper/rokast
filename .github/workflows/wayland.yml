# `rokast selftest` over the screen-sharing portal on headless GNOME and KDE sessions (tests/wayland_desktop.sh), in
# fedora:43 containers. On demand and when the Wayland capture code changes; slow (installs two desktops).
# KDE is allowed to fail: the share dialog opens and is answered, but KWin screencasts only with OpenGL compositing,
# and its virtual backend has no OpenGL without a GPU render node (/dev/dri), which hosted runners lack. The portal
# then answers Start with code 2 ("Unsupported compositing type" in the backend log).
name: wayland

on:
  workflow_dispatch:
  push:
    paths: ["src/miracast/wayland.py", "src/miracast/selftest.py", "tests/wayland_desktop.sh", "tests/portal_click.py",
            ".github/workflows/wayland.yml"]

jobs:
  desktop:
    runs-on: ubuntu-24.04
    container: fedora:43
    continue-on-error: ${{ matrix.desktop == 'kde' }}
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome, kde]
    steps:
      - uses: actions/checkout@v4
      - name: packages
        run: |
          common="python3 python3-gobject at-spi2-core dbus-daemon dbus-tools pipewire wireplumber gstreamer1
                  gstreamer1-plugins-base pipewire-gstreamer ffmpeg-free mesa-dri-drivers xdg-desktop-portal python3-dbusmock"
          case "${{ matrix.desktop }}" in
            gnome) extra="gnome-shell xdg-desktop-portal-gnome" ;;
            kde)   extra="kwin-wayland xdg-desktop-portal-kde /usr/lib64/qt6/qml/org/kde/kitemmodels/qmldir /usr/lib64/qt6/qml/org/kde/taskmanager/qmldir" ;;   # QML modules the share dialog imports
          esac
          dnf install -y -q $common $extra libcap
          # kwin_wayland has cap_sys_nice as a file capability, which the container may not grant: exec fails
          ! command -v kwin_wayland >/dev/null || setcap -r "$(command -v kwin_wayland)"
      - run: bash tests/wayland_desktop.sh ${{ matrix.desktop }}
