[package]
name = "rokast-ui"
version = "0.5.0"
edition = "2021"
description = "Desktop UI for rokast (native Miracast from Linux to Roku TVs)"
license = "MIT"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_6"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
strip = true
lto = "thin"
